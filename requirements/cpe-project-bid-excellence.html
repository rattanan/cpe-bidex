<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPE Project Bid Excellence — ระบบบริหารต้นทุนและจัดซื้อเชิงรุกสำหรับงานก่อสร้าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E211C;
  --ink-2:#17332B;
  --ink-3:#25473D;
  --paper:#E7ECEA;
  --card:#FFFFFF;
  --line:#D4DCD9;
  --line-2:#E7EDEB;
  --muted:#61756F;
  --text:#12211E;
  --amber:#E39B1F;
  --amber-soft:#FBF0DA;
  --blue:#2C6E8F;
  --blue-soft:#E3EEF3;
  --green:#2C8461;
  --green-soft:#E1F0E9;
  --red:#B8443A;
  --red-soft:#FAE6E3;
  --violet:#6A5A9E;
  --r:10px;
  --shadow:0 1px 2px rgba(14,33,28,.06), 0 8px 24px -12px rgba(14,33,28,.28);
  --font-d:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;
  --font-b:"Noto Sans Thai","IBM Plex Sans Thai",Tahoma,sans-serif;
  --font-m:"IBM Plex Mono","IBM Plex Sans Thai",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--text);
  font-family:var(--font-b);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.3;font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- TOP BAR ---------- */
.topbar{
  background:var(--ink);color:#DCE7E3;
  display:flex;align-items:center;gap:18px;
  padding:0 20px;height:56px;
  position:sticky;top:0;z-index:60;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:700;letter-spacing:.14em;font-size:15px;color:#fff}
.brand .mark{
  height:26px;padding:0 7px;border-radius:5px;background:var(--amber);
  display:grid;place-items:center;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.04em;
  font-family:var(--font-m);
}
.brand small{display:block;font-family:var(--font-b);font-weight:400;font-size:10px;letter-spacing:.02em;color:#8FA9A1;margin-top:-4px}
.topbar .spacer{flex:1}
.rolepick{display:flex;align-items:center;gap:8px;background:var(--ink-2);border-radius:8px;padding:5px 6px 5px 12px}
.rolepick label{font-size:11px;color:#8FA9A1;letter-spacing:.04em}
.rolepick select{background:var(--ink-3);border:1px solid #31564A;border-radius:6px;color:#fff;padding:5px 8px;outline:none}
.clockchip{font-size:11.5px;color:#8FA9A1;letter-spacing:.03em}
.avatar{width:30px;height:30px;border-radius:50%;background:#31564A;display:grid;place-items:center;font-size:12px;color:#DCE7E3;font-weight:600}

/* ---------- SIGNATURE: PROCESS RAIL ---------- */
.rail{
  background:var(--ink-2);
  border-bottom:1px solid #2C5548;
  padding:9px 20px 11px;
  overflow-x:auto;
}
.rail-inner{display:flex;align-items:stretch;gap:0;min-width:1280px}
.station{
  flex:1;position:relative;padding:2px 10px 0 16px;color:#8FA9A1;
  border:none;background:none;text-align:left;
}
.station:before{
  content:"";position:absolute;left:0;top:14px;width:8px;height:8px;border-radius:50%;
  background:#3B6759;outline:3px solid var(--ink-2);
}
.station:after{
  content:"";position:absolute;left:8px;top:17.5px;right:-8px;height:1px;background:#3B6759;
}
.station:last-child:after{display:none}
.station .st-n{font-family:var(--font-m);font-size:9.5px;letter-spacing:.12em;color:#6E8E84;display:block}
.station .st-t{font-size:11.5px;line-height:1.3;display:block;margin-top:5px;font-family:var(--font-d);font-weight:500}
.station .st-c{font-family:var(--font-m);font-size:10px;color:#6E8E84;margin-top:2px;display:block}
.station:hover .st-t{color:#CFE0DA}
.station.on{color:#fff}
.station.on:before{background:var(--amber);box-shadow:0 0 0 3px rgba(227,155,31,.22)}
.station.on .st-n{color:var(--amber)}
.station.on .st-c{color:#A9C2BA}
.station.done:before{background:#5C8C7C}

/* ---------- LAYOUT ---------- */
.shell{display:grid;grid-template-columns:214px 1fr;min-height:calc(100vh - 56px)}
.side{background:#F2F5F4;border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.side .grp{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:16px 10px 6px;font-family:var(--font-m)}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;
  padding:8px 10px;border-radius:8px;color:#33463F;text-align:left;font-size:13.2px;
}
.navbtn:hover{background:#E4EAE8}
.navbtn.on{background:var(--ink);color:#fff;font-weight:500}
.navbtn .ic{width:17px;text-align:center;opacity:.85;font-size:13px}
.navbtn .badge{margin-left:auto;font-family:var(--font-m);font-size:10px;background:var(--amber);color:#3A2905;border-radius:20px;padding:1px 6px}
.navbtn.on .badge{background:var(--amber);color:#3A2905}
main{padding:22px 26px 70px;max-width:1500px}

/* ---------- PAGE HEAD ---------- */
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead .eyebrow{font-family:var(--font-m);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.phead h1{font-size:23px;letter-spacing:-.01em;margin-top:3px}
.phead p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.phead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500}
.btn:hover{background:var(--ink-3)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#F2F5F4}
.btn.amber{background:var(--amber);color:#3A2905}

/* ---------- CARDS / GRID ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.card.tight{padding:0;overflow:hidden}
.card h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:12px;margin-top:2px}
.cardhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.cardhead .right{margin-left:auto;font-size:11.5px;color:var(--muted)}
.kpi .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi .val{font-family:var(--font-m);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .val small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:5px}
.up{color:var(--green)} .down{color:var(--red)}
.accent-t{border-top:3px solid var(--amber)}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{
  text-align:left;font-family:var(--font-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);background:#F7F9F8;
}
.tbl-wrap thead th{position:sticky;top:0;z-index:2}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:#F7F9F8}
tbody tr.clickable{cursor:pointer}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.tbl-wrap{max-height:none;overflow:auto}
.t-title{font-weight:500}
.t-sub{color:var(--muted);font-size:11px}

/* ---------- CHIPS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap;font-weight:500}
.c-gray{background:#EDF1F0;color:#4A5C57;border-color:#DFE6E4}
.c-amber{background:var(--amber-soft);color:#8A5D06;border-color:#F2DDB4}
.c-blue{background:var(--blue-soft);color:#1E5470;border-color:#CADFE8}
.c-green{background:var(--green-soft);color:#1D6448;border-color:#C6E3D6}
.c-red{background:var(--red-soft);color:#8E2F27;border-color:#F0CEC9}
.c-violet{background:#EDEAF6;color:#4A3D7D;border-color:#DBD5EE}
.tag{font-family:var(--font-m);font-size:10px;letter-spacing:.06em;color:var(--muted)}

/* ---------- BARS ---------- */
.bar{height:6px;border-radius:6px;background:#E7EDEB;overflow:hidden;min-width:60px}
.bar > span{display:block;height:100%;border-radius:6px;background:var(--ink-3)}
.bar.amber > span{background:var(--amber)}
.bar.green > span{background:var(--green)}
.bar.red > span{background:var(--red)}
.bar.blue > span{background:var(--blue)}
.dualbar{position:relative;height:16px}
.dualbar .plan{position:absolute;top:5px;left:0;height:6px;background:#CDD8D4;border-radius:6px}
.dualbar .act{position:absolute;top:5px;left:0;height:6px;background:var(--ink-3);border-radius:6px}

/* ---------- MISC ---------- */
.note{background:#F7F9F8;border-left:3px solid var(--amber);padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:#3B4E48}
.note b{color:var(--text)}
.split{display:flex;gap:14px;flex-wrap:wrap}
.metaline{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.metaline b{color:var(--text);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;font-size:12.5px}
.filters select:focus,.filters input:focus{border-color:var(--ink-3)}
.seg{display:inline-flex;background:#EDF1F0;border-radius:8px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:5px 11px;border-radius:6px;font-size:12.5px;color:#4A5C57}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:12.8px}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--muted)}
.stat-row .v{font-family:var(--font-m);font-weight:500}
svg{display:block;max-width:100%}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px}
.scorebars div{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.scorebars .lb{width:74px;color:var(--muted)}
.scorebars .bar{flex:1}
.scorebars .vv{width:34px;text-align:right;font-family:var(--font-m);font-size:11.5px}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--font-m);letter-spacing:.08em;color:var(--violet);background:#EDEAF6;border:1px solid #DBD5EE;padding:1px 7px;border-radius:20px}
.pain{border-left:3px solid var(--red);background:var(--red-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.3px;margin-bottom:8px}
.gain{border-left:3px solid var(--green);background:var(--green-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.3px;margin-bottom:8px}

/* ---------- DRAWER ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,33,28,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:var(--paper);z-index:90;
  transform:translateX(102%);transition:transform .24s cubic-bezier(.3,.8,.4,1);overflow-y:auto;
  box-shadow:-20px 0 50px -20px rgba(14,33,28,.5);
}
.drawer.on{transform:translateX(0)}
.drawer-head{background:var(--ink);color:#fff;padding:16px 22px;position:sticky;top:0;z-index:5}
.drawer-head .eyebrow{font-family:var(--font-m);font-size:10px;letter-spacing:.16em;color:var(--amber)}
.drawer-head h2{font-size:18px;margin-top:3px}
.drawer-head .metaline{color:#9DB5AD;margin-top:8px}
.drawer-head .metaline b{color:#fff}
.drawer-body{padding:18px 22px 60px}
.xbtn{position:absolute;top:14px;right:16px;background:#25473D;border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:15px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 13px;font-size:12.8px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:500}

@media (max-width:1150px){
  .g5,.g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;overflow-x:auto;gap:6px;padding:10px}
  .side .grp{display:none}
  .navbtn{width:auto;white-space:nowrap}
  .g2,.g4,.g5{grid-template-columns:1fr}
  main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}

/* ---------- MODAL / TOAST / INPUT ---------- */
.mwrap{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 16px;background:rgba(14,33,28,.45);overflow-y:auto}
.mwrap.on{display:flex}
.mbox{background:var(--paper);border-radius:12px;width:min(660px,100%);box-shadow:0 30px 60px -20px rgba(14,33,28,.55);overflow:hidden}
.mbox header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.mbox header h3{font-size:16px;color:#fff}
.mbox header button{margin-left:auto;background:#25473D;border:none;color:#fff;width:28px;height:28px;border-radius:7px}
.mbox .mbody{padding:18px}
.mbox .mfoot{padding:12px 18px;background:#F2F5F4;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.field input:focus,.field select:focus{border-color:var(--ink-3)}
.frow{display:grid;gap:12px;grid-template-columns:1fr 1fr}
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:9px;font-size:12.8px;box-shadow:var(--shadow);border-left:3px solid var(--amber);max-width:340px;animation:tin .18s ease-out}
.toast.ok{border-left-color:#4FBF8B}
.toast.warn{border-left-color:#E39B1F}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
input.cell{width:88px;background:#FBFCFC;border:1px solid var(--line);border-radius:6px;padding:4px 7px;text-align:right;font-family:var(--font-m);font-size:12px}
input.cell:focus{border-color:var(--amber);background:#fff}
input[type=range]{width:100%;accent-color:var(--amber)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:#EDF1F0;color:#4A5C57;margin-right:5px}
.startlist li{margin-bottom:7px;font-size:12.8px}
.startlist a{color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">CPE</span><span>CPE PROJECT<small>Bid Excellence · Cost &amp; Procurement Intelligence</small></span></div>
  <div class="spacer"></div>
  <span class="clockchip" id="clock"></span>
  <div class="rolepick">
    <label for="role">มุมมอง</label>
    <select id="role">
      <option value="exec">ผู้บริหาร</option>
      <option value="sales">ฝ่ายขาย</option>
      <option value="est">ฝ่ายวิศวกรรมประมาณราคา</option>
      <option value="pur">ฝ่ายจัดซื้อ</option>
      <option value="pm">ฝ่าย PM โครงการ</option>
      <option value="all" selected>ทุกฝ่าย (Demo)</option>
    </select>
  </div>
  <button class="btn ghost" style="padding:6px 11px;font-size:12px" onclick="location.reload()">รีเซ็ตข้อมูลตัวอย่าง</button>
  <div class="avatar">กร</div>
</div>

<div class="rail"><div class="rail-inner" id="rail"></div></div>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="mwrap" id="modalwrap"><div class="mbox" id="modalbox"></div></div>
<div id="toasts"></div>

<script>
/* =======================================================================
   CPE Project Bid Excellence — ข้อมูลจำลอง (Mock master data)
   ทุกตัวเลขร้อยต่อกันทั้งสายงาน: ขาย → ประมาณราคา → จัดซื้อ → หน้างาน
   ======================================================================= */
const F = n => n.toLocaleString('th-TH',{maximumFractionDigits:0});
const M = n => (n/1e6).toFixed(2);
const P = n => n.toFixed(1)+'%';

const SECTORS = ['งานราชการ','งานเอกชน','งานต่างประเทศ'];
const WORKTYPES = ['งานก่อสร้าง','งานโยธา','งาน MEP','งานพลังงานทดแทน','งานเครื่องจักรอุตสาหกรรม'];

/* ---------- 1) โอกาสการขาย / ประมูล ---------- */
const OPPS = [
 {id:'OPP-68-014', name:'อาคารคลังสินค้าและสำนักงาน 2 ชั้น', cust:'บจก. เอบีซี โลจิสติกส์', sector:'งานเอกชน', wt:'งานก่อสร้าง',
  bid:45_100_000, cost:38_260_500, stage:'ทำสัญญา', status:'ได้งาน', prob:100, owner:'สมชาย ว.', est:'ปวีณา ก.', due:'2026-06-18',
  area:'สมุทรปราการ', dur:9, note:'ลูกค้าเก่า ต่อยอดจากเฟส 1', winner:'เรา', gap:0},
 {id:'OPP-68-021', name:'ปรับปรุงระบบไฟฟ้าและปรับอากาศ อาคารผู้ป่วยนอก', cust:'โรงพยาบาลศูนย์ (e-bidding)', sector:'งานราชการ', wt:'งาน MEP',
  bid:22_350_000, cost:18_600_000, stage:'ยื่นซองแล้ว', status:'กำลังเสนอ', prob:55, owner:'ณัฐพล ส.', est:'ปวีณา ก.', due:'2026-08-21',
  area:'นครราชสีมา', dur:6, note:'ราคากลางประกาศ 23.8 ลบ. ต้องต่ำกว่า 3%', winner:'-', gap:0},

/* =======================================================================
   ตัวช่วยวาดกราฟ (SVG เขียนเอง ไม่พึ่งไลบรารีภายนอก)
   ======================================================================= */
function lineChart(series, labels, opt={}){
  const w=opt.w||620,h=opt.h||190,pl=42,pr=12,pt=12,pb=26;
  const all=series.flatMap(s=>s.d.filter(v=>v!==null));
  let mx=opt.max??Math.max(...all), mn=opt.min??Math.min(...all,0);
  if(mx===mn)mx=mn+1;
  const X=i=>pl+i*(w-pl-pr)/Math.max(1,labels.length-1);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);
    g+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#E7EDEB"/>`;
    g+=`<text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#61756F" font-family="IBM Plex Mono">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`;}
  labels.forEach((l,i)=>{g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="9.5" fill="#61756F">${l}</text>`;});
  if(opt.mark!==undefined&&opt.mark>=0){const xm=X(opt.mark);g+=`<line x1="${xm}" y1="${pt}" x2="${xm}" y2="${h-pb}" stroke="#E39B1F" stroke-width="1.6" stroke-dasharray="4 3"/>`;}
  series.forEach(s=>{
    const pts=s.d.map((v,i)=>v===null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length)return;
    const dd=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.fill)g+=`<path d="${dd} L${pts[pts.length-1][0]} ${Y(mn)} L${pts[0][0]} ${Y(mn)} Z" fill="${s.c}" opacity=".10"/>`;
    g+=`<path d="${dd}" fill="none" stroke="${s.c}" stroke-width="${s.w||2}" stroke-dasharray="${s.dash||''}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots!==false)pts.forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="#fff" stroke="${s.c}" stroke-width="1.8"/>`;});
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg>`;
}
function barChart(data, opt={}){
  const w=opt.w||620,h=opt.h||190,pl=opt.pl||42,pr=10,pt=14,pb=34;
  const mx=Math.max(...data.map(d=>Math.max(d.v,d.v2||0)))*1.12||1;
  const bw=(w-pl-pr)/data.length, Y=v=>pt+(1-v/mx)*(h-pt-pb);
  let g='';
  for(let i=0;i<=3;i++){const y=pt+(h-pt-pb)*i/3;
    g+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#E7EDEB"/>`;
    g+=`<text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#61756F" font-family="IBM Plex Mono">${Math.round(mx*(3-i)/3).toLocaleString()}</text>`;}
  data.forEach((d,i)=>{
    const x=pl+i*bw, pad=bw*0.22, iw=(bw-pad*2)/(d.v2!==undefined?2:1);
    g+=`<rect x="${x+pad}" y="${Y(d.v)}" width="${iw-2}" height="${Math.max(1,h-pb-Y(d.v))}" fill="${d.c||opt.c||'#25473D'}" rx="2"/>`;
    if(d.v2!==undefined)g+=`<rect x="${x+pad+iw}" y="${Y(d.v2)}" width="${iw-2}" height="${Math.max(1,h-pb-Y(d.v2))}" fill="${opt.c2||'#E39B1F'}" rx="2"/>`;
    g+=`<text x="${x+bw/2}" y="${h-19}" text-anchor="middle" font-size="9.5" fill="#61756F">${d.l}</text>`;
    if(d.l2)g+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle" font-size="9" fill="#93A5A0">${d.l2}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg>`;
}
function donut(parts, opt={}){
  const s=opt.s||150, r=s/2-6, ir=opt.ir||r*0.62, cx=s/2, cy=s/2;
  const tot=parts.reduce((a,b)=>a+b.v,0)||1; let a0=-Math.PI/2, g='';
  parts.forEach(p=>{
    const a1=a0+p.v/tot*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const X0=cx+ir*Math.cos(a1),Y0=cy+ir*Math.sin(a1),X1=cx+ir*Math.cos(a0),Y1=cy+ir*Math.sin(a0);
    g+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1} L${X0} ${Y0} A${ir} ${ir} 0 ${big} 0 ${X1} ${Y1} Z" fill="${p.c}"/>`;
    a0=a1;});
  if(opt.center)g+=`<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="19" font-family="IBM Plex Mono" font-weight="600" fill="#12211E">${opt.center}</text>`;
  if(opt.sub)g+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" fill="#61756F">${opt.sub}</text>`;
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}">${g}</svg>`;
}
function spark(d, c='#25473D', w=90, h=26){
  const mx=Math.max(...d),mn=Math.min(...d),rg=(mx-mn)||1;
  const pts=d.map((v,i)=>[i*w/(d.length-1),h-2-((v-mn)/rg)*(h-5)]);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.4" fill="${c}"/></svg>`;
}
function stackBar(rows,opt={}){
  const w=opt.w||620,rh=opt.rh||26,pl=opt.pl||128,h=rows.length*rh+8;
  const mx=Math.max(...rows.map(r=>r.v))*1.1||1;let g='';
  rows.forEach((r,i)=>{
    const y=i*rh+4, bw=(r.v/mx)*(w-pl-64);
    g+=`<text x="${pl-9}" y="${y+13}" text-anchor="end" font-size="11" fill="#3B4E48">${r.l}</text>`;
    g+=`<rect x="${pl}" y="${y+3}" width="${Math.max(2,bw)}" height="13" rx="3" fill="${r.c||'#25473D'}"/>`;
    g+=`<text x="${pl+bw+8}" y="${y+14}" font-size="10.5" font-family="IBM Plex Mono" fill="#61756F">${r.t}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg>`;
}

let VIEW='exec', ROLE='all';
const $=s=>document.querySelector(s);

function drawRail(){
  $('#rail').innerHTML = PROCESS.map((p,i)=>{
    const on = p.v===VIEW;
    return `<button class="station ${on?'on':''} ${i<3?'done':''}" onclick="go('${p.v}')">
      <span class="st-n">${p.n}</span><span class="st-t">${p.t}</span><span class="st-c">${p.c}</span></button>`;
  }).join('');
}
function drawNav(){
  $('#side').innerHTML = NAV.map(g=>{
    const items=g.items.filter(i=>i.roles.includes(ROLE));
    if(!items.length)return '';
    return `<div class="grp">${g.g}</div>`+items.map(i=>
      `<button class="navbtn ${i.v===VIEW?'on':''}" onclick="go('${i.v}')"><span class="ic">${i.ic}</span>${i.t}${i.badge?`<span class="badge">${i.badge}</span>`:''}</button>`).join('');
  }).join('');
}
function go(v){
  const allowed=NAV.flatMap(g=>g.items).find(i=>i.v===v);
  if(allowed && !allowed.roles.includes(ROLE)) ROLE='all', $('#role').value='all';
  VIEW=v; drawNav(); drawRail(); render(); window.scrollTo({top:0,behavior:'instant'});
}
$('#role').addEventListener('change',e=>{
  ROLE=e.target.value;
  const first=NAV.flatMap(g=>g.items).filter(i=>i.roles.includes(ROLE));
  if(!first.find(i=>i.v===VIEW)) VIEW=first[0].v;
  drawNav(); drawRail(); render();
});
function openDrawer(html){
  $('#drawer').innerHTML=html; $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  $('#drawer').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
}
function closeDrawer(){
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden','true'); document.body.style.overflow='';
}
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
function dtab(btn,id){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('[data-pane]').forEach(p=>p.style.display='none');
  document.querySelector(`[data-pane="${id}"]`).style.display='';
}

function saveOpp(){
  const n=val('no-n').trim(); if(!n){toast('กรุณากรอกชื่องานก่อนบันทึก','warn');return;}
  const cost=numv('no-cost'), m=numv('no-m')||15, wt=val('no-w'), sector=val('no-s');
  const id='OPP-68-'+String(46+OPPS.filter(o=>o.id.startsWith('OPP-68')).length-9).padStart(3,'0');
  const mo=bidModel(wt,sector);
  OPPS.unshift({id,name:n,cust:val('no-c')||'ยังไม่ระบุ',sector,wt,bid:Math.round(cost/(1-m/100)),cost,
    stage:'รับแบบ/ศึกษาความต้องการ',status:'กำลังเสนอ',prob:Math.round(winProb(mo,m)*100),
    owner:val('no-o'),est:'ปวีณา ก.',due:'2026-10-15',area:val('no-a'),dur:8,note:'งานใหม่ที่เพิ่งรับเข้าระบบ',winner:'-',gap:0});

}

            const pv=CATALOG.find(x=>x.code==='MAT-PV-006');
            const pvItem=items.find(i=>i.d.includes('แผงโซลาร์'));
            if(pvItem)warn.push(`<div class="gain"><b>แผงโซลาร์ราคาลดลง ${Math.abs(pv.fc)}%</b> — หากสั่งซื้อไตรมาสหน้าจะประหยัดได้ประมาณ ${F(Math.round(pvItem.q*pv.cur*Math.abs(pv.fc)/100))} บาท</div>`);

            if(empty.length)warn.push(`<div class="pain"><b>ยังไม่มีรายการใน ${empty.length} หมวด</b> — ${empty.join(', ')} · ถ้าไม่ใส่ ต้นทุนจะต่ำกว่าความเป็นจริง</div>`);

              if(miss.length)warn.push(`<div class="pain"><b>ขาดหมวดงานมาตรฐาน</b> — ${miss.join(', ')}</div>`);}
            if(!warn.length)warn.push(`<div class="gain"><b>ไม่พบความผิดปกติ</b> — ราคาทุกรายการตรงกับฐานข้อมูลกลาง และหมวดงานครบตามมาตรฐาน</div>`);
            return warn.join('');
         })()}
       </div>
     </div>`;
}

/* ---------- เริ่มทำ BOQ / คัดลอกจากงานเดิม / เพิ่ม-ลบรายการ ---------- */
const BOQCATS={};
function catsOf(id){
  const fromItems=[...new Set((BOQ[id]||[]).map(i=>i.cat))];
  return [...new Set([...(BOQCATS[id]||[]),...fromItems])];
}
function startModal(id){
  const o=OPPS.find(x=>x.id===id);
  const src=Object.keys(BOQ).filter(k=>k!==id).map(k=>OPPS.find(x=>x.id===k)).filter(Boolean);
  const same=src.filter(x=>x.wt===o.wt);
  openModal('เริ่มจัดทำ BOQ — '+o.name,
   `<div class="note" style="margin-bottom:12px">${o.wt} · ${SIZE[id]?F(SIZE[id].q)+' '+SIZE[id].u:'ยังไม่ระบุขนาดงาน'} · กำหนดยื่น ${o.due}</div>
    <div class="field"><label>วิธีเริ่มต้น</label><select id="st-m">
      <option value="blank">สร้างใหม่จากหมวดงานมาตรฐานของ${o.wt}</option>
      ${same.map(x=>`<option value="${x.id}">คัดลอกจาก ${x.name.slice(0,30)} (${x.id})</option>`).join('')}
      ${src.filter(x=>x.wt!==o.wt).map(x=>`<option value="${x.id}">คัดลอกจาก ${x.name.slice(0,30)} (ต่างประเภทงาน)</option>`).join('')}
    </select></div>
    <div class="note">การคัดลอกจะปรับปริมาณตามสัดส่วนขนาดงานให้อัตโนมัติ ถ้าใช้หน่วยเดียวกัน แล้วค่อยแก้รายบรรทัดทีหลัง</div>`,
   `<button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="startBOQ('${id}',val('st-m'))">สร้าง BOQ</button>`);
}
function startBOQ(id,mode){
  const o=OPPS.find(x=>x.id===id);
  const pol=MASTER.wt.find(w=>w.n===o.wt)||{oh:6,risk:3};
  IND[id]=1+(pol.oh+pol.risk)/100;
  let msg='';
  if(mode&&mode!=='blank'&&BOQ[mode]){
    const f=(SIZE[id]&&SIZE[mode]&&SIZE[id].u===SIZE[mode].u&&SIZE[mode].q)?SIZE[id].q/SIZE[mode].q:1;
    BOQ[id]=BOQ[mode].map(i=>({...i,q:+(i.q*f).toFixed(2)}));
    BOQCATS[id]=catsOf(mode);
    msg=`คัดลอก ${BOQ[id].length} รายการจาก ${mode}${f!==1?` และปรับปริมาณ ×${f.toFixed(2)} ตามขนาดงาน`:''}`;
  } else {
    BOQ[id]=[]; BOQCATS[id]=(MASTER.cats[o.wt]||['งานหลัก','งานสนับสนุน','งานอื่นๆ']).slice();
    msg=`สร้าง BOQ เปล่าพร้อมหมวดงานมาตรฐาน ${BOQCATS[id].length} หมวด`;
  }
  recalcCost(id); ESTID=id; delete REVIEW[id];
  closeModal(); render(); toast(msg+' — เริ่มใส่รายการได้เลย');
}
function copyModal(id){startModal(id);}
function rowModal(id,cat){
  const cats=catsOf(id);
  openModal('เพิ่มรายการใน BOQ',
   `<div class="field"><label>หมวดงาน</label><select id="r-c">${cats.map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}<option value="__new">+ หมวดงานใหม่</option></select></div>
    <div class="field"><label>ชื่อหมวดงานใหม่ (กรอกเมื่อเลือก “หมวดงานใหม่”)</label><input id="r-cn" placeholder="เช่น งานรื้อถอน"></div>
    <div class="field"><label>เลือกรายการจากฐานข้อมูลต้นทุนกลาง</label><select id="r-m">
      ${CATALOG.map(c=>`<option value="${c.code}">${c.n} — ${F(c.cur)} บ./${c.u}</option>`).join('')}</select></div>
    <div class="frow"><div class="field"><label>ปริมาณ</label><input id="r-q" type="number" value="1"></div>
      <div class="field"><label>ค่าแรง/ติดตั้ง ต่อหน่วย (บาท)</label><input id="r-l" type="number" value="0"></div></div>`,
   `<button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="saveRow('${id}')">เพิ่มรายการ</button>`);
}
function saveRow(id){
  const c=CATALOG.find(x=>x.code===val('r-m'));
  let cat=val('r-c'); if(cat==='__new'){cat=val('r-cn').trim(); if(!cat){toast('กรุณาตั้งชื่อหมวดงานใหม่','warn');return;} BOQCATS[id]=[...catsOf(id),cat];}
  const q=numv('r-q'); if(q<=0){toast('ปริมาณต้องมากกว่าศูนย์','warn');return;}
  BOQ[id].push({cat, code:c.code.replace('MAT-','').replace('LAB-','').replace('MCH-',''), d:c.n, u:c.u, q,
    mat:c.cur, lab:numv('r-l'), src:'ฐานข้อมูลกลาง', vol:c.vola==='สูงมาก'?'สูง':c.vola});
  recalcCost(id); delete REVIEW[id];
  closeModal(); render(); toast(`เพิ่ม ${c.n} แล้ว — ต้นทุนรวมเป็น ${M(OPPS.find(o=>o.id===id).cost)} ลบ.`);
}
function delRow(id,idx){
  const it=BOQ[id][idx]; BOQ[id].splice(idx,1); recalcCost(id); delete REVIEW[id];
  render(); toast(`ลบรายการ ${it.d} แล้ว`);
}

function editBOQ(id,idx,f,v){
  const n=parseFloat(String(v).replace(/,/g,''));
  if(isNaN(n)||n<0){toast('กรุณากรอกตัวเลขที่ถูกต้อง','warn');render();return;}
  BOQ[id][idx][f]=n; recalcCost(id);
  if(REVIEW[id]){delete REVIEW[id]; toast('BOQ เปลี่ยน — สถานะตรวจต้นทุนถูกยกเลิก ต้องตรวจใหม่','warn');}
  render();
  toast('อัปเดตแล้ว — ต้นทุนรวมเป็น '+M(OPPS.find(o=>o.id===id).cost)+' ลบ.');
}

function saveQuote(id){
  const r=RFQS.find(x=>x.id===id), vc=val('q-v'), v=VENDORS.find(x=>x.code===vc), p=numv('q-p');
  if(p<=0){toast('กรุณากรอกราคาที่เสนอ','warn');return;}
  if(r.quotes.some(q=>q.v===vc)){toast('ผู้เสนอราคารายนี้บันทึกไว้แล้ว','warn');return;}
  r.quotes.push({v:vc,n:v.n,p,days:numv('q-d'),term:val('q-t'),valid:val('q-va'),score:savgW(v.s),note:'บันทึกโดยฝ่ายจัดซื้อ'});
  r.status='เปรียบเทียบราคา';
  closeModal(); render();
  const d=(p-r.budget)/r.budget*100;
  toast(`บันทึกใบเสนอราคาของ ${v.n} แล้ว — ${d<0?'ต่ำกว่า':'สูงกว่า'}ต้นทุนกลาง ${Math.abs(d).toFixed(1)}%`);
}
function awardPO(id,vc){
  const r=RFQS.find(x=>x.id===id), q=r.quotes.find(x=>x.v===vc);

}

   `<div class="note" style="margin-bottom:12px">ให้คะแนน 0–100 ในแต่ละด้าน ระบบจะถ่วงน้ำหนักตามที่ตั้งไว้ใน Data Master แล้วคำนวณเกรดใหม่ทันที</div>
    ${MASTER.dims.map(d=>`<div class="field"><label>${d.n} (น้ำหนัก ${d.w}%)</label><input id="ev-${d.k}" type="number" min="0" max="100" value="${v.s[d.k]}"></div>`).join('')}

function saveEval(code){
  const v=VENDORS.find(x=>x.code===code), old=savgW(v.s), og=gradeOf(old);
  MASTER.dims.forEach(d=>{const n=numv('ev-'+d.k); v.s[d.k]=Math.max(0,Math.min(100,Math.round(n)));});
  const av=savgW(v.s), g=gradeOf(av);
  v.status = MASTER.dims.some(d=>v.s[d.k]<70) ? (av<65?'ระงับชั่วคราว':'เฝ้าระวัง') : 'ใช้งาน';
  v.last='ส.ค. 2026';
  closeModal(); render();
  toast(`บันทึกผลประเมิน ${v.n} แล้ว — คะแนน ${old} → ${av}${g!==og?` · เกรดเปลี่ยนจาก ${og} เป็น ${g}`:''}`);
}

   `<div class="seg"><button class="on">กำลังดำเนินการ</button><button>ปิดงานแล้ว</button></div>`)
  + `<div class="grid g4" style="margin-bottom:14px">
      <div class="card kpi accent-t"><div class="lbl">มูลค่าสัญญารวม</div><div class="val">${M(totV)}<small>ลบ.</small></div><div class="delta">${PROJECTS.length} โครงการ</div></div>
      <div class="card kpi accent-t"><div class="lbl">ต้นทุนที่ใช้ไป + ผูกพัน</div><div class="val">${M(totC)}<small>ลบ.</small></div><div class="delta">${(totC/totB*100).toFixed(0)}% ของงบต้นทุน</div></div>
      <div class="card kpi accent-t"><div class="lbl">งานคงเหลือ (Backlog)</div><div class="val">${M(act.reduce((a,p)=>a+p.value*(1-p.act[p.cursor]/100),0))}<small>ลบ.</small></div><div class="delta">รับรู้รายได้ใน 8 เดือนข้างหน้า</div></div>
      <div class="card kpi accent-t"><div class="lbl">โครงการที่ล่าช้ากว่าแผน</div><div class="val" style="color:var(--red)">${PROJECTS.filter(p=>p.act[p.cursor]-p.plan[p.cursor]<-3).length}</div><div class="delta down">ต้องมีแผนเร่งรัดภายในสัปดาห์นี้</div></div>
     </div>
     <div class="grid g2">
     ${PROJECTS.map(p=>{
       const a=p.act[p.cursor], pl=p.plan[p.cursor], d=a-pl;

       return `<div class="card">
         <div class="cardhead"><div><h3>${p.name}</h3><div class="sub mono">${p.code} · ${p.cust} · PM ${p.pm}</div></div>
           <div class="right"><span class="chip ${st[0]}">${st[1]}</span></div></div>
         ${lineChart([
            {d:p.plan,c:'#93A5A0',dash:'4 4',dots:false},
            {d:p.act.map(v=>v||null),c:'#25473D',fill:true}

         <div class="legend" style="margin-bottom:10px"><span><i style="background:#93A5A0"></i>แผน</span><span><i style="background:#25473D"></i>ทำได้จริง</span></div>
         <div class="stat-row"><span class="k">มูลค่าสัญญา / งบต้นทุน</span><span class="v">${M(p.value)} / ${M(p.budget)} ลบ.</span></div>
         <div class="stat-row"><span class="k">จ่ายจริง + ภาระผูกพัน</span><span class="v">${M(used)} ลบ. (${(used/p.budget*100).toFixed(0)}%)</span></div>

function bidModel(wt,sector){
  const set=HISTBIDS.filter(h=>h.wt===wt);
  const w=set.filter(h=>h.win), l=set.filter(h=>!h.win);
  const avg=a=>a.reduce((x,y)=>x+y.mg,0)/(a.length||1);
  let m0 = (w.length&&l.length)?(avg(w)+avg(l))/2 : 15;
  m0 += (MASTER.sector.find(x=>x.n===sector)||{adj:0}).adj;
  return {m0, s:2.2, n:set.length, wins:w.length, set};
}
function winProb(model,m){return 0.85/(1+Math.exp((m-model.m0)/model.s));}

/* กราฟกระจาย ใช้ในหน้าวิเคราะห์ราคา */
function scatter(pts,opt={}){
  const w=opt.w||620,h=opt.h||220,pl=54,pr=14,pt=14,pb=32;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=Math.min(...xs)*0.96,x1=Math.max(...xs)*1.04,y0=Math.min(...ys)*0.94,y1=Math.max(...ys)*1.06;
  const X=v=>pl+(v-x0)/((x1-x0)||1)*(w-pl-pr), Y=v=>pt+(1-(v-y0)/((y1-y0)||1))*(h-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){const yv=y0+(y1-y0)*i/4,y=Y(yv);
    g+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#E7EDEB"/>`;
    g+=`<text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#61756F" font-family="IBM Plex Mono">${opt.fy?opt.fy(yv):Math.round(yv)}</text>`;}
  for(let i=0;i<=4;i++){const xv=x0+(x1-x0)*i/4,x=X(xv);
    g+=`<text x="${x}" y="${h-10}" text-anchor="middle" font-size="9.5" fill="#61756F" font-family="IBM Plex Mono">${opt.fx?opt.fx(xv):xv.toFixed(0)}</text>`;}
  pts.forEach(p=>{
    if(p.star){
      g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="9" fill="#E39B1F" opacity=".25"/>
          <circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="#E39B1F" stroke="#fff" stroke-width="2"/>
          <text x="${X(p.x)}" y="${Y(p.y)-13}" text-anchor="middle" font-size="10" font-weight="600" fill="#8A5D06">ราคาที่กำลังพิจารณา</text>`;
    } else {
      g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.win?'#2C8461':'#B8443A'}" opacity=".85"><title>${p.t}</title></circle>`;

function applyBid(id,m){
  const o=OPPS.find(x=>x.id===id);
  const mo=bidModel(o.wt,o.sector);
  o.bid=Math.round(o.cost/(1-m/100)); o.prob=Math.round(winProb(mo,m)*100);
  BIDM=null; render();
  toast(`บันทึกราคาเสนอ ${F(o.bid)} บาท (กำไร ${m.toFixed(1)}%) — อัปเดตโอกาสชนะเป็น ${o.prob}% แล้ว`);
}


/* =======================================================================
   บันทึกผลการเสนอราคา: ได้งาน → เปิดโครงการและตั้งชุดขอราคาตามงบประมาณ

const PMS=['วิชัย ป.','อนุชา ร.','ศักดิ์ชัย ม.','ธีรพงษ์ ค.'];
function addMonths(d,n){const x=new Date(d); x.setMonth(x.getMonth()+n); return x.toISOString().slice(0,10);}
function scurve(n){const a=[];for(let i=0;i<n;i++){const t=(i+1)/n;a.push(Math.round(100*(3*t*t-2*t*t*t)));}a[n-1]=100;return a;}

function resultModal(id){

      <button class="btn" style="padding:16px" onclick="closeModal();winModal('${o.id}')">ได้งาน<div style="font-weight:400;font-size:11.5px;opacity:.8;margin-top:4px">เปิดโครงการและตั้งชุดขอราคา</div></button>
      <button class="btn ghost" style="padding:16px" onclick="closeModal();lostModal('${o.id}')">ไม่ได้งาน<div style="font-weight:400;font-size:11.5px;color:var(--muted);margin-top:4px">เก็บข้อมูลไว้วิเคราะห์ครั้งหน้า</div></button>
    </div>`,
   `<button class="btn ghost" onclick="closeModal()">ปิด</button>`);
}
function winModal(id){
  const o=OPPS.find(x=>x.id===id);
  openModal('บันทึกว่าได้งาน — '+o.name,
   `<div class="note" style="margin-bottom:12px">เมื่อบันทึกแล้ว ระบบจะเปิดโครงการให้ฝ่าย PM และตั้งชุดขอราคาให้ฝ่ายจัดซื้อตามงบประมาณที่ตั้งไว้ใน BOQ โดยอัตโนมัติ</div>

    ${BOQ[id]?`<div class="field"><label><input type="checkbox" id="w-gen" checked style="width:auto;margin-right:7px">ตั้งชุดขอราคาจากหมวดงานใน BOQ ให้ฝ่ายจัดซื้อทันที (${[...new Set(BOQ[id].map(i=>i.cat))].length} แพ็กเกจ)</label></div>`
      :`<div class="note">งานนี้ยังไม่มี BOQ แยกรายการ ระบบจะเปิดโครงการให้อย่างเดียว ฝ่ายจัดซื้อต้องสร้างชุดขอราคาเอง</div>`}`,
   `<button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="saveWin('${id}')">บันทึกว่าได้งาน</button>`);

function saveWin(id){
  const o=OPPS.find(x=>x.id===id);
  const value=numv('w-v'), budget=numv('w-b'), dur=Math.max(2,Math.min(9,numv('w-d')||o.dur)), start=val('w-s'), pm=val('w-pm');
  const gen=BOQ[id]&&document.getElementById('w-gen')&&document.getElementById('w-gen').checked;
  o.status='ได้งาน'; o.stage='ทำสัญญา'; o.prob=100; o.winner='เรา'; o.bid=value; o.contract=val('w-ct');
  const code='PRJ-26'+String(PROJECTS.length+11).padStart(2,'0');
  const n=dur, plan=scurve(n);
  PROJECTS.unshift({code, name:o.name, cust:o.cust, wt:o.wt, sector:o.sector,
    value, budget, actual:0, commit:0, pm, start, end:addMonths(start,dur),
    plan, act:plan.map(()=>0), cursor:0,
    cin:plan.map((v,i)=>i%2===0?Math.round(value/Math.ceil(n/2)/1000):0),
    cout:plan.map(()=>Math.round(budget/n/1000)),
    risks:[{r:'โครงการเพิ่งเปิด ยังไม่ได้ผู้รับเหมาครบทุกแพ็กเกจ',i:'กลาง',a:'ติดตามผลการขอราคาจากฝ่ายจัดซื้อ'}]});
  let made=0;
  if(gen) made=genPackages(id, code, start, dur);
  closeModal(); render();
  openModal('บันทึกเรียบร้อย — เปิดโครงการ '+code,
   `<div class="gain"><b>${o.name}</b><div style="margin-top:6px">มูลค่าสัญญา ${F(value)} บาท · งบต้นทุน ${F(budget)} บาท · PM ${pm}</div></div>
    ${made?`<div class="note" style="margin-top:10px"><b>ตั้งชุดขอราคาให้ฝ่ายจัดซื้อแล้ว ${made} แพ็กเกจ</b> — แต่ละแพ็กเกจมีต้นทุนกลางมาจากงบประมาณที่ตั้งไว้ใน BOQ หมวดนั้น ฝ่ายจัดซื้อเปิดดูและส่งขอราคาได้ทันที</div>`:''}
    <div class="stat-row" style="margin-top:10px"><span class="k">ขั้นตอนถัดไป</span><span class="v">จัดซื้อเลือก Vendor และขอราคา</span></div>`,
   `<button class="btn ghost" onclick="closeModal();go('projects')">ไปหน้าบริหารโครงการ</button>
    <button class="btn" onclick="closeModal();go('procurement')">ไปหน้าจัดซื้อ</button>`);
  toast(`บันทึกว่าได้งานแล้ว — เปิดโครงการ ${code}${made?` และตั้งชุดขอราคา ${made} แพ็กเกจ`:''}`);
}
function genPackages(id, prjCode, start, dur){
  const o=OPPS.find(x=>x.id===id); if(!BOQ[id])return 0;
  const cats=[...new Set(BOQ[id].map(i=>i.cat))];
  let made=0;
  cats.forEach((c,ix)=>{
    if(RFQS.some(r=>r.prj===id&&r.pkg===c))return;
    const items=BOQ[id].filter(i=>i.cat===c);
    const budget=Math.round(items.reduce((a,i)=>a+i.q*(i.mat+i.lab),0));
    const spec=items.every(i=>i.src&&!i.src.includes('ประสบการณ์'))?1:0;
    RFQS.push({id:'RFQ-68-'+(120+RFQS.length), prj:id, prjn:o.name.slice(0,28), pkg:c, budget,
      need: addMonths(start||'2026-09-01', Math.max(1,Math.round(dur*(ix+1)/cats.length))),
      status:'รวบรวมเอกสาร', buyer: ix%2?'อรวรรณ ท.':'กิตติ พ.', prjCode,
      docs:{boq:1,tor:1,dwg:1,spec,safety:0}, quotes:[]});
    made++;
  });
  return made;
}

function saveLost(id){
  const o=OPPS.find(x=>x.id===id), wp=numv('l-p'), reason=val('l-r');
  o.status='ไม่ได้งาน'; o.stage='แพ้ประมูล'; o.prob=0; o.winner=val('l-w')||'ไม่ทราบ';
  o.gap=wp>0?-Math.abs((o.bid-wp)/wp*100):0; o.note=val('l-n')||o.note;
  const L=LOSS.find(l=>l.r===reason); if(L)L.n+=1;
  const tot=LOSS.reduce((a,l)=>a+l.n,0); LOSS.forEach(l=>l.pct=Math.round(l.n/tot*100));
  if(SIZE[id])HISTBIDS.push({id:o.id,n:o.name,wt:o.wt,sector:o.sector,yr:2569,u:SIZE[id].u,q:SIZE[id].q,
    uc:o.cost/SIZE[id].q,mg:(o.bid-o.cost)/o.bid*100,win:false,gap:+Math.abs(o.gap).toFixed(1),ub:o.bid/SIZE[id].q});
  closeModal(); render();
  toast(`บันทึกผลแล้ว — เพิ่มงานนี้เข้าคลังข้อมูลเพื่อใช้เทียบราคาครั้งหน้า (เราสูงกว่าผู้ชนะ ${Math.abs(o.gap).toFixed(1)}%)`);
}

    <div class="field"><label>วันเริ่มงาน</label><input id="g-s" type="date" value="2026-09-01"></div>`
    :`<div class="note">ยังไม่มีโครงการที่ได้งานและมี BOQ แยกรายการ — ไปที่หน้าโอกาสการขายแล้วกด “บันทึกผล” เป็นได้งานก่อน</div>`,
   cand.length?`<button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="runGen()">สร้างชุดขอราคา</button>`:'');
}
function runGen(){
  const id=val('g-p'), made=genPackages(id, null, val('g-s'), OPPS.find(o=>o.id===id).dur);
  closeModal(); render();
  toast(made?`สร้างชุดขอราคา ${made} แพ็กเกจจากงบประมาณ BOQ แล้ว`:'โครงการนี้มีชุดขอราคาครบทุกหมวดแล้ว','ok');
}

/* =======================================================================
   ROUTER
   ======================================================================= */
const VIEWS={exec:vExec,sales:vSales,estimate:vEstimate,costcheck:vCostcheck,bidsim:vBidsim,
  catalog:vCatalog,forecast:vForecast,procurement:vProcurement,vendors:vVendors,projects:vProjects,
  cash:vCash,knowledge:vKnowledge};
function render(){
  const ae=document.activeElement, aid=ae&&ae.id;
  let ss=null; try{ss=ae&&ae.selectionStart;}catch(e){}
  $('#main').innerHTML=(VIEWS[VIEW]||vExec)();
  if(aid){const el=document.getElementById(aid);
    if(el&&el.focus){el.focus(); try{if(ss!==null&&ss!==undefined)el.setSelectionRange(ss,ss);}catch(e){}}}
}
drawNav(); drawRail(); render();
</script>
